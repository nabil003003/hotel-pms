_format_version: "3.0"
_transform: true

# Sprint 8 (D15) : Kong OSS (image kong:3.5, pas Kong Enterprise) n'a pas de
# Dev Portal natif pour agréger des schémas OpenAPI — cette fonctionnalité
# est réservée à l'édition Enterprise. Ce fichier route donc le
# `/openapi.json` natif de chacun des 11 services à travers Kong sous un
# chemin prévisible (`/openapi/{service}.json`). Un conteneur `swagger-ui`
# séparé (profil `gateway`, son propre port hôte 8090 — pas routé via Kong,
# voir le commentaire sur ce service dans docker-compose.yml) consomme ces
# 11 URLs pour les présenter dans un sélecteur unique, servant le même
# besoin (§8.3 point 1 : "documentation unifiée agrégeant les schémas
# OpenAPI de chaque service") sans prétendre que Kong OSS fait nativement
# quelque chose qu'il ne fait pas.
#
# Le routage applicatif réel (API métier) continue de passer par le BFF
# Next.js (`frontend/app/api/proxy/{service}/...` -> `lib/proxy.ts`),
# vérifié de bout en bout depuis le Sprint 1 — Kong n'est PAS mis dans ce
# chemin ce sprint (aucun besoin de rate-limiting/routing centralisé validé
# jusqu'ici, et le réintroduire maintenant remplacerait un mécanisme déjà
# testé par un nouveau non testé). Kong sert uniquement de point d'entrée
# pour la doc agrégée dans ce sprint.

services:
  - name: auth-gateway-service
    url: http://auth-gateway-service:8000
    routes:
      - name: auth-gateway-openapi
        paths: ["/openapi/auth-gateway-service.json"]
        strip_path: true
        methods: ["GET"]
    plugins:
      - name: request-transformer
        config:
          replace:
            uri: /openapi.json

