# Thème de login Keycloak hébergé, re-skinné avec la palette des maquettes
# (Design/PMS 1/login.html) — voir décision D4 du plan Sprint 1 : le flow réel
# est Authorization Code + PKCE, donc l'utilisateur atterrit sur CETTE page
# hébergée par Keycloak, pas sur un formulaire Next.js custom.
#
# Vérifier le nom du thème parent contre la version Keycloak réellement
# déployée (24+ utilise le thème v2 par défaut, "keycloak.v2") avant la
# première mise en prod — valeur ci-dessous à ajuster si besoin.
parent=keycloak
import=common/keycloak

styles=css/login.css css/amh-login.css
