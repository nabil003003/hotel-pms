# ====================================================================
# SONARQUBE / SONARCLOUD CONFIGURATION
# Project: PMS Alidentec Hospitality (Property Management System)
# ====================================================================

sonar.projectKey=pms-alidentec-hospitality
sonar.projectName=PMS Alidentec Hospitality
sonar.projectVersion=2.1.0-pfa

# Sources & Tests
sonar.sources=services,frontend/app,frontend/components,frontend/lib,frontend/store
sonar.tests=services
sonar.test.inclusions=**/*test*.py,**/tests/**

# File encodings & languages
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
sonar.javascript.environments=browser,node

# Inclusions / Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/.next/**,**/infra/pgdata/**,**/infra/minio-data/**,**/coverage/**,**/*.spec.ts,**/*.min.js
sonar.coverage.exclusions=**/tests/**,**/migrations/**,**/*.config.js,**/*.config.mjs,**/*.config.ts

# Code Quality & Duplications thresholds
sonar.cpd.exclusions=**/tests/**,**/fixtures/**
